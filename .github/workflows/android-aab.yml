name: Build Android AAB (Managed Expo)

on:
  workflow_dispatch:

jobs:
  build-android-aab:
    name: Build Android AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      # 1. Generate the native /android folder on the fly
      - name: Expo Prebuild
        run: npx expo prebuild --platform android --no-install

      # 2. Decode the keystore file back to binary directly inside the runner workspace
      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/production.jks

      # 3. Build and Sign with Gradle simultaneously using environment properties
      - name: Build and Sign production Android app bundle
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_MYAPP_RELEASE_STORE_FILE: production.jks
          ORG_GRADLE_PROJECT_MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      # 4. Upload the production AAB directly (Gradle natively overrides the file name as app-release.aab)
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: tutor-production-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error